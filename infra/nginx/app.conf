# Configuração do container `web`: serve a SPA e encaminha /api e /gateway.
#
# Quem termina o TLS é o nginx do HOST; aqui a escuta é http, em rede interna.

# Sem bloco `upstream`: o nginx resolveria o nome UMA vez, na inicialização, e
# guardaria o IP. Quando o container do backend reinicia ele costuma ganhar
# outro IP, e o nginx seguiria mandando para o antigo até ser recarregado —
# falha que só aparece semanas depois, no primeiro restart.
#
# Com o nome numa variável, a resolução passa a ser por requisição, usando o
# DNS interno do Docker (sempre 127.0.0.11).
server {
  listen 80;

  resolver 127.0.0.11 valid=10s ipv6=off;

  server_name _;

  root /usr/share/nginx/html;

  index index.html;

  client_max_body_size 25m;

  location /api/ {
    set $backend_app backend;

    # Com proxy_pass em variável a barra final deixa de remover o prefixo,
    # então o rewrite faz esse trabalho: /api/auth/login -> /auth/login
    rewrite ^/api/(.*)$ /$1 break;

    proxy_pass http://$backend_app:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Conciliação e relatórios de marketplace demoram.
    proxy_read_timeout 300s;
  }

  location /gateway/ {
    set $gateway_app gateway;

    rewrite ^/gateway/(.*)$ /$1 break;

    proxy_pass http://$gateway_app:3001;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_read_timeout 300s;
  }

  # Assets versionados pelo build podem ser cacheados com folga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rota de SPA: qualquer caminho cai no index, e o router resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
