# Origem única para frontend, API e gateway.
#
# Existe porque um túnel (ngrok) publica UMA porta, e o OAuth do Mercado Livre
# exige uma redirect_uri HTTPS fixa apontando para o backend. Servindo tudo pela
# mesma origem, o callback vira:
#
#   https://<dominio>/api/integracoes/mercado-livre/callback
#
# e o frontend passa a usar caminhos relativos (sem CORS).

upstream frontend_app {
  server frontend:5173;
}

upstream backend_app {
  server backend:3000;
}

upstream gateway_app {
  server gateway:3001;
}

server {
  listen 80;

  server_name _;

  # Uploads e respostas de relatório podem ser grandes.
  client_max_body_size 25m;

  # A barra final no proxy_pass remove o prefixo: /api/auth/login -> /auth/login
  location /api/ {
    proxy_pass http://backend_app/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # O TLS termina no túnel; sem isto o Rails acha que a requisição é http.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_read_timeout 180s;
  }

  location /gateway/ {
    proxy_pass http://gateway_app/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_read_timeout 180s;
  }

  location / {
    proxy_pass http://frontend_app;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # WebSocket do hot reload do Vite.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
