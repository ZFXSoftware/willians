version: "3.9"

services:
  frontend:
    build: ./frontend
    environment:
      # Atrás do proxy, caminhos relativos: mesma origem, sem CORS.
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-}
      - VITE_ALLOWED_HOST=${PUBLIC_HOST:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3050:3000"
      - "5173:5173"
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    command: npm run dev
    environment:
      - MODE=api
      - SERVICE_API_TOKEN=${SERVICE_API_TOKEN:-}
    volumes:
      - ./gateway:/app
      - /app/node_modules
    ports:
      - "3051:3001"
    depends_on:
      - backend
      - redis

  worker:
    build: ./gateway
    command: npm run dev
    environment:
      - MODE=worker
      - SERVICE_API_TOKEN=${SERVICE_API_TOKEN:-}
    volumes:
      - ./gateway:/app
      - /app/node_modules
    depends_on:
      - backend
      - redis

  scheduler:
    build: ./gateway
    command: npm run dev
    environment:
      - MODE=scheduler
      - SERVICE_API_TOKEN=${SERVICE_API_TOKEN:-}
    volumes:
      - ./gateway:/app
      - /app/node_modules
    depends_on:
      - backend
      - redis

  # Origem única (frontend + /api + /gateway) numa porta só, para expor tudo por
  # um túnel HTTPS: `ngrok http 8080 --domain=SEU-DOMINIO.ngrok-free.dev`
  proxy:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - gateway
      - backend

  redis:
    image: redis:7
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6479:6379"

  backend:
    build: ./backend
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      # Preenchidos pelo .env da raiz (não versionado). Sem as chaves, o
      # backend cai automaticamente nos clientes de simulação.
      - OMIE_APP_KEY=${OMIE_APP_KEY:-}
      - OMIE_APP_SECRET=${OMIE_APP_SECRET:-}
      - OMIE_ALLOW_WRITES=${OMIE_ALLOW_WRITES:-}
      - OMIE_CLIENTE_FORNECEDOR_ID=${OMIE_CLIENTE_FORNECEDOR_ID:-}
      - OMIE_CONTA_CORRENTE_ID=${OMIE_CONTA_CORRENTE_ID:-}
      - SERVICE_API_TOKEN=${SERVICE_API_TOKEN:-}
      - MARKETPLACE_SIMULATION=${MARKETPLACE_SIMULATION:-}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-}
      - ALLOWED_HOSTS=${PUBLIC_HOST:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - ML_CLIENT_ID=${ML_CLIENT_ID:-}
      - ML_CLIENT_SECRET=${ML_CLIENT_SECRET:-}
      - ML_REDIRECT_URI=${ML_REDIRECT_URI:-}
      - ML_USE_PKCE=${ML_USE_PKCE:-}
      - ML_AUTH_HOST=${ML_AUTH_HOST:-}
      - ML_API_HOST=${ML_API_HOST:-}
      - SHOPEE_PARTNER_ID=${SHOPEE_PARTNER_ID:-}
      - SHOPEE_PARTNER_KEY=${SHOPEE_PARTNER_KEY:-}
      - SHOPEE_REGION=${SHOPEE_REGION:-}
      - SHOPEE_HOST=${SHOPEE_HOST:-}
      - SHOPEE_REDIRECT_URI=${SHOPEE_REDIRECT_URI:-}
      - AMAZON_CLIENT_ID=${AMAZON_CLIENT_ID:-}
      - AMAZON_CLIENT_SECRET=${AMAZON_CLIENT_SECRET:-}
      - AMAZON_APP_ID=${AMAZON_APP_ID:-}
      - AMAZON_REGION=${AMAZON_REGION:-}
      - AMAZON_HOST=${AMAZON_HOST:-}
      - AMAZON_CONSENT_HOST=${AMAZON_CONSENT_HOST:-}
      - AMAZON_REDIRECT_URI=${AMAZON_REDIRECT_URI:-}
      - TINY_TOKEN=${TINY_TOKEN:-}
      - TINY_API_VERSION=${TINY_API_VERSION:-}
      - TINY_V2_URL=${TINY_V2_URL:-}
      - TINY_V3_URL=${TINY_V3_URL:-}
      - AR_ENCRYPTION_PRIMARY_KEY=${AR_ENCRYPTION_PRIMARY_KEY:-}
      - AR_ENCRYPTION_DETERMINISTIC_KEY=${AR_ENCRYPTION_DETERMINISTIC_KEY:-}
      - AR_ENCRYPTION_KEY_DERIVATION_SALT=${AR_ENCRYPTION_KEY_DERIVATION_SALT:-}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
      # Gems persistem fora da imagem: alterar o Gemfile não exige rebuild, e um
      # build sem rede não deixa o ambiente quebrado.
      - bundle_cache:/usr/local/bundle
    ports:
      - "3053:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_development
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  redis_data:
  bundle_cache:




