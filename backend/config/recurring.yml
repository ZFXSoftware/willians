# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Rede de segurança para contas que ficam tempo sem ingestão: o caminho normal
  # é a renovação sob demanda no TokenProvider. Só roda com o supervisor do
  # Solid Queue ativo (`bin/jobs`), que ainda NÃO está no docker-compose.
  refresh_marketplace_credentials:
    class: Marketplace::RefreshCredentialsJob
    schedule: every hour at minute 7
